{% load static %}
<footer class="site-footer w-full max-w-none m-0 pt-3 pb-2 px-6 max-[640px]:px-4
    text-[var(--footer-text)] bg-[var(--footer-bg)] [border-top:1px_solid_var(--footer-line)]">
    <div class="flex items-center justify-between gap-4 mx-auto max-w-[1120px]
        max-[640px]:flex-wrap max-[640px]:justify-center
        [.menu-page_&]:max-[640px]:justify-between">
        <a class="inline-flex items-center" href="{% url 'home' %}#top">
            <img class="block h-auto w-[168px] max-[640px]:w-[148px] [.dessert-page_&]:max-[640px]:w-[136px]" src="{% static 'img/logo_nishimuraya.svg' %}" alt="Nishimuraya 和洋創作料理 ロゴ">
        </a>
        <div class="flex items-center">
            <a class="inline-flex items-center justify-center min-h-[42px] py-0 px-5 rounded-[999px]
                border border-[rgba(231,217,196,0.68)] text-[#f3ebe3] no-underline text-[14px] tracking-[0.04em]
                [transition:background-color_0.2s_ease,color_0.2s_ease]
                hover:bg-[rgba(216,176,122,0.18)] hover:text-white
                max-[640px]:min-h-10 max-[640px]:px-4 max-[640px]:text-[13px]" href="{% url 'contact' %}">お問い合わせはこちら</a>
        </div>
    </div>
    <p class="mx-auto mt-2.5 mb-0 max-w-[1120px] text-center font-semibold text-[13px] max-[640px]:text-[12px]">© 2026 Nishimuraya All Rights Reserved.</p>
</footer>
